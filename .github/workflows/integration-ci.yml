name: Hardened Image Integration CI Pipeline

on:
  pull_request:
    paths:
      - "tests/integration/**"
      - "images/runtime/debian/**"
      - "images/runtime/python/**"
      - "images/runtime/node/**"
      - "images/runtime/java/**"
      - "images/runtime/nginx/**"
      - ".github/workflows/integration-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Test Python Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Python Application Test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/integration/python/test-python-app.sh
          tests/integration/python/test-python-app.sh

  node:
    name: Test Node.js Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Node.js Application Test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/integration/node/test-node-app.sh
          tests/integration/node/test-node-app.sh

  java:
    name: Test Java Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Java Application Test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/integration/java/test-java-app.sh
          tests/integration/java/test-java-app.sh

  nginx:
    name: Test Nginx Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Nginx Application Test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/integration/nginx/test-nginx-app.sh
          tests/integration/nginx/test-nginx-app.sh

  integration-summary:
    name: Validate Integration Results
    runs-on: ubuntu-latest
    needs:
      - python
      - node
      - java
      - nginx

    steps:
      - name: Write Integration Summary
        shell: bash
        run: |
          {
            echo "## Hardened Image Integration CI"
            echo
            echo "- Python application: passed"
            echo "- Node.js application: passed"
            echo "- Java application: passed"
            echo "- Nginx application: passed"
            echo
            echo "All applications ran successfully using hardened runtime settings."
            echo
            echo "Runtime controls exercised:"
            echo "- Non-root UID/GID 10001:10001"
            echo "- Read-only root filesystem"
            echo "- All Linux capabilities dropped"
            echo "- no-new-privileges enabled"
            echo "- Writable /tmp supplied explicitly"
          } >> "${GITHUB_STEP_SUMMARY}"