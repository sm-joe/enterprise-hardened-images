name: Image Release Pipeline

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        type: choice
        options:
          - debian
      version:
        description: Image version
        required: true
        type: string
        default: "13"

permissions:
  contents: read

jobs:
  build:
    name: Build release image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          version="${{ inputs.version }}"

          if [[ "${version}" == "latest" ]]; then
            echo "ERROR: latest tag is not permitted"
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Debian version must be numeric"
            exit 1
          fi

          echo "Release version: ${version}"
          echo "Release tag: ${version}.${GITHUB_RUN_NUMBER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Debian release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/debian/Dockerfile
          push: false
          tags: |
            enterprise-hardened-debian:${{ inputs.version }}
            enterprise-hardened-debian:${{ inputs.version }}.${{ github.run_number }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true