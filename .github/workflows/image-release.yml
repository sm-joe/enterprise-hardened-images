name: Image Release Pipeline

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        type: choice
        options:
          - debian
      version:
        description: Image version
        required: true
        type: string
        default: "13"

permissions:
  contents: read

jobs:
  build:
    name: Build release image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Debian release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/debian/Dockerfile
          push: false
          tags: |
            enterprise-hardened-debian:${{ inputs.version }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true