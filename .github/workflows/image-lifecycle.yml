name: Hardened Image Lifecycle Pipeline

on:
  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:
    inputs:
      scan_cves:
        description: "Scan published images for vulnerabilities"
        required: true
        type: boolean
        default: true

      rebuild_on_cve:
        description: "Trigger release workflows for qualifying CVEs"
        required: true
        type: boolean
        default: false

      rebuild_on_upstream:
        description: "Trigger release workflows when an upstream version changes"
        required: true
        type: boolean
        default: true

      rebuild_family:
        description: "Optional image family to rebuild"
        required: false
        type: choice
        options:
          - none
          - debian
          - python
          - node
          - java
          - nginx
        default: none

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  validate:
    name: Validate Lifecycle Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      config-valid: ${{ steps.validate.outputs.config-valid }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Lifecycle Manifest
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/lifecycle/images.yaml

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/lifecycle/images.yaml")
          text = path.read_text()

          required = [
              "debian",
              "python",
              "node",
              "java",
              "nginx",
          ]

          for family in required:
              if f"name: {family}" not in text:
                  raise SystemExit(
                      f"FAIL: lifecycle family missing: {family}"
                  )

          print("PASS: lifecycle manifest contains all five image families")
          PY

          echo "config-valid=true" >> "${GITHUB_OUTPUT}"

  upstream:
    name: Check Upstream Versions
    needs: validate
    if: >
      github.event_name == 'schedule' ||
      inputs.rebuild_on_upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      debian-status: ${{ steps.detect.outputs.debian-status }}
      python-status: ${{ steps.detect.outputs.python-status }}
      node-status: ${{ steps.detect.outputs.node-status }}
      node-version: ${{ steps.detect.outputs.node-version }}
      java-status: ${{ steps.detect.outputs.java-status }}
      nginx-status: ${{ steps.detect.outputs.nginx-status }}
      nginx-version: ${{ steps.detect.outputs.nginx-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make Upstream Check Executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/check-upstream-updates.sh

          test -x scripts/check-upstream-updates.sh

          echo "PASS: upstream check script is executable"

      - name: Run Upstream Check
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/check-upstream-updates.sh \
            | tee upstream-check.txt

          get_status() {
            local heading="$1"

            awk -v heading="${heading}" '
              $0 == heading {
                found=1
                next
              }

              found && /^Status:/ {
                sub(/^Status:[[:space:]]*/, "")
                print
                exit
              }
            ' upstream-check.txt
          }

          get_version() {
            local heading="$1"

            awk -v heading="${heading}" '
              $0 == heading {
                found=1
                next
              }

              found && /^Upstream:/ {
                sub(/^Upstream:[[:space:]]*/, "")
                print
                exit
              }
            ' upstream-check.txt
          }

          debian_status="$(get_status "== Debian 13 ==")"
          python_status="$(get_status "== Python 3.13 ==")"
          node_status="$(get_status "== Node.js 22 ==")"
          java_status="$(get_status "== Java 21 ==")"
          nginx_status="$(get_status "== Nginx 1.28 ==")"

          node_version="$(get_version "== Node.js 22 ==")"
          nginx_version="$(get_version "== Nginx 1.28 ==")"

          for value in \
            "${debian_status}" \
            "${python_status}" \
            "${node_status}" \
            "${java_status}" \
            "${nginx_status}"; do
            if [[ -z "${value}" ]]; then
              echo "FAIL: unable to parse upstream status"
              exit 1
            fi
          done

          if [[ -z "${node_version}" ]]; then
            echo "FAIL: unable to parse Node.js upstream version"
            exit 1
          fi

          if [[ -z "${nginx_version}" ]]; then
            echo "FAIL: unable to parse Nginx upstream version"
            exit 1
          fi

          echo "debian-status=${debian_status}" >> "${GITHUB_OUTPUT}"
          echo "python-status=${python_status}" >> "${GITHUB_OUTPUT}"
          echo "node-status=${node_status}" >> "${GITHUB_OUTPUT}"
          echo "node-version=${node_version}" >> "${GITHUB_OUTPUT}"
          echo "java-status=${java_status}" >> "${GITHUB_OUTPUT}"
          echo "nginx-status=${nginx_status}" >> "${GITHUB_OUTPUT}"
          echo "nginx-version=${nginx_version}" >> "${GITHUB_OUTPUT}"

          echo
          echo "Upstream status:"
          echo "Debian:  ${debian_status}"
          echo "Python:  ${python_status}"
          echo "Node:    ${node_status} (${node_version})"
          echo "Java:    ${java_status}"
          echo "Nginx:   ${nginx_status} (${nginx_version})"

      - name: Upload Upstream Evidence
        uses: actions/upload-artifact@v7
        with:
          name: upstream-check
          path: upstream-check.txt
          if-no-files-found: error
          retention-days: 30

  scan:
    name: Scan Published Images
    needs: validate
    if: ${{ github.event_name == 'schedule' || inputs.scan_cves }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            image: ghcr.io/sm-joe/enterprise-hardened-debian:13

          - family: python
            image: ghcr.io/sm-joe/enterprise-hardened-python:3.13

          - family: node
            image: ghcr.io/sm-joe/enterprise-hardened-node:22

          - family: java
            image: ghcr.io/sm-joe/enterprise-hardened-java:21

          - family: nginx
            image: ghcr.io/sm-joe/enterprise-hardened-nginx:1.28

    steps:
      - name: Scan Image
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy-${{ matrix.family }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Evaluate Vulnerabilities
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          family = "${{ matrix.family }}"
          path = Path(f"trivy-{family}.json")

          data = json.loads(path.read_text())

          findings = []

          for result in data.get("Results", []):
              for vulnerability in result.get("Vulnerabilities", []) or []:
                  severity = vulnerability.get("Severity", "")

                  if severity in {"CRITICAL", "HIGH"}:
                      findings.append({
                          "id": vulnerability.get("VulnerabilityID"),
                          "severity": severity,
                          "package": vulnerability.get("PkgName"),
                          "installed": vulnerability.get("InstalledVersion"),
                          "fixed": vulnerability.get("FixedVersion"),
                      })

          output = Path(f"lifecycle-{family}.txt")

          if findings:
              output.write_text(
                  "\n".join(
                      f'{item["severity"]} '
                      f'{item["id"]} '
                      f'{item["package"]} '
                      f'{item["installed"]} '
                      f'-> {item["fixed"] or "no-fixed-version"}'
                      for item in findings
                  )
              )

              print(
                  f"FOUND: {len(findings)} qualifying vulnerabilities "
                  f"for {family}"
              )
          else:
              output.write_text("NO_QUALIFYING_VULNERABILITIES\n")
              print(f"PASS: no qualifying vulnerabilities for {family}")
          PY

      - name: Upload Lifecycle Evidence
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-${{ matrix.family }}
          path: |
            trivy-${{ matrix.family }}.json
            lifecycle-${{ matrix.family }}.txt
          if-no-files-found: error
          retention-days: 30

  cve-rebuild:
    name: Trigger CVE Rebuild
    needs:
      - validate
      - scan
    if: >
      needs.scan.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_on_cve
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Download Lifecycle Evidence
        uses: actions/download-artifact@v8
        with:
          pattern: lifecycle-*
          path: lifecycle-evidence
          merge-multiple: true

      - name: Check Fixed Vulnerabilities
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail

          rebuild_families=()

          for family in debian python node java nginx; do
            file="lifecycle-evidence/lifecycle-${family}.txt"

            if [[ ! -f "${file}" ]]; then
              echo "FAIL: missing lifecycle evidence: ${file}"
              exit 1
            fi

            if grep -q "NO_QUALIFYING_VULNERABILITIES" "${file}"; then
              echo "PASS: ${family} has no qualifying vulnerabilities"
              continue
            fi

            if grep -qE -- '-> [^[:space:]]+' "${file}"; then
              echo "CVE rebuild required: ${family}"
              rebuild_families+=("${family}")
            else
              echo "No fixed vulnerability requiring rebuild: ${family}"
            fi
          done

          if [[ "${#rebuild_families[@]}" -eq 0 ]]; then
            echo "rebuild-required=false" >> "${GITHUB_OUTPUT}"
            echo "PASS: no CVE rebuilds required"
            exit 0
          fi

          echo "rebuild-required=true" >> "${GITHUB_OUTPUT}"
          echo "families=${rebuild_families[*]}" >> "${GITHUB_OUTPUT}"

      - name: Trigger CVE Release Workflows
        if: steps.evaluate.outputs.rebuild-required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          FAMILIES: ${{ steps.evaluate.outputs.families }}
        shell: bash
        run: |
          set -euo pipefail

          for family in ${FAMILIES}; do
            case "${family}" in
              debian)
                WORKFLOW="image-release.yml"
                VERSION="13"
                ;;

              python)
                WORKFLOW="python-release.yml"
                VERSION="3.13"
                ;;

              node)
                WORKFLOW="node-release.yml"
                VERSION="22"
                ;;

              java)
                WORKFLOW="java-release.yml"
                VERSION="21"
                ;;

              nginx)
                WORKFLOW="nginx-release.yml"
                VERSION="1.28"
                ;;

              *)
                echo "FAIL: unsupported CVE rebuild family: ${family}"
                exit 1
                ;;
            esac

            echo "Triggering CVE rebuild for ${family}"

            gh workflow run "${WORKFLOW}" \
              --repo "${REPOSITORY}" \
              --ref main \
              -f version="${VERSION}"

            echo "PASS: ${WORKFLOW} dispatched"
          done

  manual-rebuild:
    name: Trigger Requested Rebuild
    needs:
      - validate
      - scan
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.rebuild_family != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Family Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAMILY: ${{ inputs.rebuild_family }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          case "${FAMILY}" in
            debian)
              WORKFLOW="image-release.yml"
              VERSION="13"
              ;;

            python)
              WORKFLOW="python-release.yml"
              VERSION="3.13"
              ;;

            node)
              WORKFLOW="node-release.yml"
              VERSION="22"
              ;;

            java)
              WORKFLOW="java-release.yml"
              VERSION="21"
              ;;

            nginx)
              WORKFLOW="nginx-release.yml"
              VERSION="1.28"
              ;;

            *)
              echo "FAIL: unsupported family: ${FAMILY}"
              exit 1
              ;;
          esac

          echo "Triggering ${WORKFLOW} for ${FAMILY}:${VERSION}"

          gh workflow run "${WORKFLOW}" \
            --repo "${REPOSITORY}" \
            --ref main \
            -f version="${VERSION}"

          echo "PASS: release workflow dispatched"

  upstream-rebuild:
    name: Trigger Upstream Rebuild
    needs:
      - validate
      - upstream
    if: >
      needs.upstream.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        inputs.rebuild_on_upstream
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Upstream Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEBIAN_STATUS: ${{ needs.upstream.outputs.debian-status }}
          PYTHON_STATUS: ${{ needs.upstream.outputs.python-status }}
          NODE_STATUS: ${{ needs.upstream.outputs.node-status }}
          NODE_VERSION: ${{ needs.upstream.outputs.node-version }}
          JAVA_STATUS: ${{ needs.upstream.outputs.java-status }}
          NGINX_STATUS: ${{ needs.upstream.outputs.nginx-status }}
          NGINX_VERSION: ${{ needs.upstream.outputs.nginx-version }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_release() {
            local workflow="$1"
            local version="$2"
            local upstream_version="${3:-}"

            echo
            echo "Dispatching ${workflow}"
            echo "Image version: ${version}"

            if [[ -n "${upstream_version}" ]]; then
              echo "Upstream version: ${upstream_version}"

              gh workflow run "${workflow}" \
                --repo "${REPOSITORY}" \
                --ref main \
                -f version="${version}" \
                -f upstream_version="${upstream_version}"
            else
              gh workflow run "${workflow}" \
                --repo "${REPOSITORY}" \
                --ref main \
                -f version="${version}"
            fi

            echo "PASS: ${workflow} dispatched"
          }

          if [[ "${DEBIAN_STATUS}" == "UPDATE_AVAILABLE" ]]; then
            dispatch_release \
              "image-release.yml" \
              "13"
          fi

          if [[ "${PYTHON_STATUS}" == "UPDATE_AVAILABLE" ]]; then
            dispatch_release \
              "python-release.yml" \
              "3.13"
          fi

          if [[ "${NODE_STATUS}" == "UPDATE_AVAILABLE" ]]; then
            dispatch_release \
              "node-release.yml" \
              "22" \
              "${NODE_VERSION}"
          fi

          if [[ "${JAVA_STATUS}" == "UPDATE_AVAILABLE" ]]; then
            dispatch_release \
              "java-release.yml" \
              "21"
          fi

          if [[ "${NGINX_STATUS}" == "UPDATE_AVAILABLE" ]]; then
            dispatch_release \
              "nginx-release.yml" \
              "1.28" \
              "${NGINX_VERSION}"
          fi

          if [[
            "${DEBIAN_STATUS}" != "UPDATE_AVAILABLE" &&
            "${PYTHON_STATUS}" != "UPDATE_AVAILABLE" &&
            "${NODE_STATUS}" != "UPDATE_AVAILABLE" &&
            "${JAVA_STATUS}" != "UPDATE_AVAILABLE" &&
            "${NGINX_STATUS}" != "UPDATE_AVAILABLE"
          ]]; then
            echo "PASS: no upstream updates detected"
          fi

  lifecycle-summary:
    name: Write Lifecycle Summary
    needs:
      - validate
      - upstream
      - scan
      - cve-rebuild
      - manual-rebuild
      - upstream-rebuild
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write Summary
        shell: bash
        run: |
          {
            echo "## Hardened Image Lifecycle"
            echo
            echo "- Configuration validation: completed"
            echo "- Upstream version detection: ${{ needs.upstream.result }}"
            echo "- Published image vulnerability scans: ${{ needs.scan.result }}"
            echo "- CVE rebuild: ${{ needs.cve-rebuild.result }}"
            echo "- Manual rebuild: ${{ needs.manual-rebuild.result }}"
            echo "- Upstream rebuild: ${{ needs.upstream-rebuild.result }}"
            echo
            echo "Families monitored:"
            echo "- Debian 13"
            echo "- Python 3.13"
            echo "- Node.js 22"
            echo "- Java 21"
            echo "- Nginx 1.28"
            echo
            echo "CVE rebuilds are triggered for HIGH/CRITICAL vulnerabilities with a known fixed version."
            echo "Upstream rebuilds use detected upstream versions for Node.js and Nginx."
            echo "Normal release workflows continue using Dockerfile defaults when no upstream override is supplied."
            echo "Production promotion remains separate from lifecycle rebuilds."
          } >> "${GITHUB_STEP_SUMMARY}"