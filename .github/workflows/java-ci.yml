name: Java 21 CI

on:
  pull_request:
    paths:
      - "images/runtime/java/**"
      - "metadata/java.yaml"
      - "metadata/image.schema.json"
      - "tests/container/test-java-base.sh"
      - "hardening/**"
      - "policies/**"
      - ".github/workflows/java-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Java 21 image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Required Files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "images/runtime/java/Dockerfile"
            "metadata/java.yaml"
            "metadata/image.schema.json"
            "tests/container/test-java-base.sh"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "FAIL: required file missing: ${file}"
              exit 1
            fi

            echo "PASS: ${file}"
          done

      - name: Validate Java Metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("metadata/java.yaml")
          text = path.read_text()

          required = {
              "name": "java",
              "family": "runtime",
              "version": "21",
          }

          for key, expected in required.items():
              match = re.search(
                  rf'^{re.escape(key)}:\s*"?([^"\n]+)"?\s*$',
                  text,
                  re.MULTILINE,
              )

              if not match:
                  raise SystemExit(
                      f"FAIL: missing metadata field: {key}"
                  )

              actual = match.group(1).strip()

              if actual != expected:
                  raise SystemExit(
                      f"FAIL: {key}={actual!r}; expected {expected!r}"
                  )

          print("PASS: Java metadata is valid")
          PY

      - name: Lint Java Dockerfile
        uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: images/runtime/java/Dockerfile
          failure-threshold: warning

      - name: Scan Repository Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build Java Image
        run: |
          docker build \
            --tag enterprise-hardened-java:test \
            images/runtime/java

      - name: Inspect Java Image
        run: |
          docker image inspect enterprise-hardened-java:test

      - name: Run Java Container Regression Tests
        run: |
          chmod +x tests/container/test-java-base.sh
          tests/container/test-java-base.sh enterprise-hardened-java:test

      - name: Scan Java Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          image-ref: enterprise-hardened-java:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate Java SBOM
        uses: anchore/sbom-action@v0
        with:
          image: enterprise-hardened-java:test
          format: spdx-json
          output-file: java-sbom.spdx.json
          artifact-name: java-sbom.spdx.json

      - name: Upload Java SBOM
        uses: actions/upload-artifact@v6
        with:
          name: java-21-sbom
          path: java-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: CI Summary
        shell: bash
        run: |
          {
            echo "## Java 21 CI"
            echo
            echo "- Dockerfile lint: passed"
            echo "- Repository configuration scan: passed"
            echo "- Image build: passed"
            echo "- Container regression tests: passed"
            echo "- Vulnerability scan: passed"
            echo "- SBOM: generated"
          } >> "${GITHUB_STEP_SUMMARY}"