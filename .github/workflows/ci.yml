name: Foundation CI Pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "hardening/**"
      - "images/**"
      - "metadata/**"
      - "policies/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "hardening/**"
      - "images/**"
      - "metadata/**"
      - "policies/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  validate:
    name: Validate foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate metadata
        run: python scripts/validate_metadata.py

      - name: Lint Debian Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/base/debian/Dockerfile
          failure-threshold: warning

      - name: Validate Debian container tests
        run: |
          docker buildx build \
            --tag enterprise-hardened-debian:test \
            images/base/debian

          docker image inspect enterprise-hardened-debian:test

          bash tests/container/test-debian-base.sh enterprise-hardened-debian:test

      - name: Check repository policy
        run: |
          test -f docs/SECURITY-STANDARDS.md
          test -f docs/ARCHITECTURE.md
          test -f metadata/image.schema.json
          test -f metadata/debian.yaml
