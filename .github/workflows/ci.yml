name: Foundation CI Pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "hardening/**"
      - "images/**"
      - "metadata/**"
      - "policies/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "hardening/**"
      - "images/**"
      - "metadata/**"
      - "policies/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  validate:
    name: CI Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate metadata
        run: python scripts/validate_metadata.py

      - name: Lint Debian Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/base/debian/Dockerfile
          failure-threshold: warning

      - name: Scan container configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan repository for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Validate Debian container tests
        run: |
          docker buildx build \
            --tag enterprise-hardened-debian:test \
            images/base/debian

          docker image inspect enterprise-hardened-debian:test

          bash tests/container/test-debian-base.sh enterprise-hardened-debian:test
          bash tests/runtime/test-debian-runtime.sh enterprise-hardened-debian:test

      - name: Scan Debian image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          image-ref: enterprise-hardened-debian:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate Debian image SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: enterprise-hardened-debian:test
          format: spdx-json
          output-file: debian-sbom.spdx.json
          artifact-name: debian-sbom.spdx.json

      - name: Check repository policy
        run: |
          test -f docs/SECURITY-STANDARDS.md
          test -f docs/ARCHITECTURE.md
          test -f metadata/image.schema.json
          test -f metadata/debian.yaml
